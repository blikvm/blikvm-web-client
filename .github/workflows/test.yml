name: Demo checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node hid.test.mjs
      - run: node --check app.js && node --check receiver.js && node --check hid.js && node --check i18n.js
      - run: python3 -m py_compile serve.py
